<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solmar Heat — an open-world crime game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1226;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #hud { position: fixed; inset: 0; pointer-events: none; color: #eef1f5; z-index: 5; }
  #hud.menu-open #game { filter: blur(2px) brightness(0.6); }
  .hud-tl { position: absolute; top: 14px; left: 14px; display: flex; flex-direction: column; gap: 6px; }
  .hud-health { width: 220px; height: 14px; background: rgba(10,14,22,0.72); border: 1px solid #555; border-radius: 7px; overflow: hidden; }
  .hud-health-fill { height: 100%; width: 100%; background: #4ade80; }
  .hud-cash { font-size: 22px; font-weight: 800; color: #4ade80; text-shadow: 0 1px 3px #000; }
  .hud-ammo { font-size: 13px; color: #eef1f5; text-shadow: 0 1px 2px #000; }
  .hud-tr { position: absolute; top: 14px; right: 14px; text-align: right; }
  .hud-stars { font-size: 26px; letter-spacing: 2px; text-shadow: 0 1px 3px #000; }
  .hud-clock { font-size: 16px; color: #eef1f5; text-shadow: 0 1px 2px #000; }
  .hud-mission { position: absolute; top: 112px; left: 14px; background: rgba(10,14,22,0.72);
    border-left: 4px solid #4ade80; padding: 10px 14px; max-width: 340px; border-radius: 4px; }
  .hud-mission-title { font-weight: 800; font-size: 15px; color: #4ade80; }
  .hud-mission-text { font-size: 13px; color: #eef1f5; margin-top: 2px; }
  .hud-mission-timer { font-size: 20px; font-weight: 800; margin-top: 4px; }
  .hud-prompt { position: absolute; bottom: 120px; left: 50%; transform: translateX(-50%);
    background: rgba(10,14,22,0.8); padding: 8px 16px; border-radius: 4px; font-size: 15px; display: none; }
  .hud-toast { position: absolute; bottom: 170px; left: 50%; transform: translateX(-50%);
    background: rgba(10,14,22,0.85); padding: 10px 18px; border-radius: 4px; font-size: 15px;
    opacity: 0; transition: opacity 0.3s; max-width: 560px; text-align: center; }
  .hud-speed { position: absolute; bottom: 16px; right: 16px; font-size: 26px; font-weight: 800; text-shadow: 0 1px 3px #000; }
  .hud-help { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
    font-size: 12px; color: #9aa3b2; text-shadow: 0 1px 2px #000; }
  .hud-map-wrap { position: absolute; bottom: 14px; left: 14px; border: 2px solid rgba(255,255,255,0.35);
    border-radius: 6px; overflow: hidden; background: #101a10; }
  .hud-map { display: block; }
  .hud-screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 12px; background: rgba(5,8,16,0.55); pointer-events: auto; text-align: center; }
  .hud-title { font-size: 64px; font-weight: 900; letter-spacing: 4px; margin: 0; color: #f2c94c;
    text-shadow: 0 3px 0 #b8442e, 0 6px 18px #000; }
  .hud-sub { font-size: 17px; color: #eef1f5; margin: 0 0 8px; max-width: 560px; }
  .hud-btn { pointer-events: auto; cursor: pointer; font-size: 17px; font-weight: 700; color: #10141b;
    background: #f2c94c; border: none; border-radius: 6px; padding: 12px 28px; min-width: 220px; }
  .hud-btn:hover { background: #ffd94d; }
  .hud-btn:disabled { background: #555; color: #999; cursor: default; }
  .hud-btn-sm { min-width: 0; font-size: 14px; padding: 8px 14px; margin: 4px 4px 0 0; }
  .hud-controls { font-size: 14px; line-height: 1.7; color: #c8d0dc; white-space: pre-line; }
  .hud-tip { font-size: 13px; color: #9aa3b2; }
  .hud-phone { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 380px; background: rgba(8,12,20,0.94); border: 2px solid #3a4a6b; border-radius: 12px;
    padding: 18px; pointer-events: auto; }
  .hud-phone h2 { margin: 0 0 10px; font-size: 18px; color: #f2c94c; }
  .hud-phone-sec { font-size: 14px; line-height: 1.8; margin-bottom: 12px; }
  .hud-phone .hud-btn { display: block; margin-top: 8px; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.min.js" } }
</script>
</head>
<body>
<canvas id="game" aria-label="Solmar Heat: an open-world crime game in the city of Solmar"></canvas>
<div id="hud"></div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
